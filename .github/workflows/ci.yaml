name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          version: v2.5.2
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --check --config-path=stylua.toml lua/

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nvim"
          gh release download v0.12.5 --repo neovim/neovim --pattern nvim-linux-x86_64.tar.gz --dir "$RUNNER_TEMP/nvim"
          tar -xzf "$RUNNER_TEMP/nvim/nvim-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/nvim"
          echo "$RUNNER_TEMP/nvim/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: |
          nvim --version
          nvim --headless -i NONE -n -u tests/minimal_init.lua -c "PlenaryBustedDirectory tests/ {minimal_init = 'tests/minimal_init.lua', sequential = true}"
      - name: Validate documentation
        run: |
          python3 scripts/gen_help.py --check
          python3 scripts/test_docs.py
          python3 scripts/test_wiki_sync.py
